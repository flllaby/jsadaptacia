<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>крутой сайт</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>НАИКРУТЕЙШИЙ САЙТ</h1>
            <h2>тут крутое</h2>
            <div id="user-info" class="user-info-block"></div>
        </header>

        <nav>
            <a href="#actions">Крутое</a>
            <a href="#top">Топ пользователей</a>
            <a href="#schedules">Расписание</a>
            <a href="#add">Добавить поступок</a>
            <a href="profile.html">Мой профиль</a>
        </nav>

        <main>
            <section id="actions" class="section">
                <h2>КРУТОЕ </h2>
                <div id="cool-actions-list" class="cards-grid"></div>
            </section>

            <section id="top" class="section">
                <h2>ТОП ПОЛЬЗОВАТЕЛЕЙ ПО КРУТОМУ </h2>
                <div id="top-users-list" class="cards-grid"></div>
            </section>

            <section id="schedules" class="section">
                <h2>РАСПИСАНИЕ МЕРОПРИЯТИЙ</h2>
                <div id="schedules-list" class="cards-grid"></div>
            </section>

            <section id="add" class="section">
                <h2>ДОБАВИТЬ КРУТОЙ ПОСТУПОК</h2>
                <form id="action-form" class="action-form">
                    <input type="text" id="action_title" placeholder="Название поступка" required>
                    <textarea id="action_description" placeholder="Описание крутоГО" rows="3"></textarea>
                    <input type="number" id="coolness_points" placeholder="Очки крутоГО (1-100)" min="1" max="100" required>
                    <button type="submit" class="btn-submit">ДОБАВИТЬ!</button>
                </form>
            </section>
        </main>

        <footer>
            <p>Самый крутейший сайт</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
